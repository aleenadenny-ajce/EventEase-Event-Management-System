# ==============================================================================
# EventEase — Kubernetes Deployment Manifest
# Demonstrates Pod replication, rolling updates, resource limits, and health probes
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventease-deployment
  namespace: eventease
  labels:
    app: eventease
    app.kubernetes.io/name: eventease
    app.kubernetes.io/part-of: eventease-system
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: eventease
  template:
    metadata:
      labels:
        app: eventease
    spec:
      containers:
        - name: eventease
          image: eventease:v1.0
          # IfNotPresent enables Minikube to use the local image loaded via 'minikube image load eventease:v1.0'
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          
          # Environment Configuration from ConfigMap and Secret
          envFrom:
            - configMapRef:
                name: eventease-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: eventease-secret
                  key: SECRET_KEY

          # Compute Resource Allocation (Requests and Limits)
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          # Readiness Probe: Determines when the Pod is ready to receive network traffic
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 2

          # Liveness Probe: Determines if the container needs to be restarted
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          # Local volume mount for database storage
          volumeMounts:
            - name: eventease-storage
              mountPath: /app/database

      # Volume configuration
      # ------------------------------------------------------------------------
      # ARCHITECTURAL NOTE FOR COLLEGE VIVA / EVALUATION:
      # SQLite is an embedded file-based database engine. When running multiple
      # Pod replicas in Kubernetes, each Pod using an 'emptyDir' volume maintains
      # an isolated local SQLite file.
      # In enterprise cloud production, multi-replica applications connect to an
      # external shared database cluster (e.g., AWS RDS PostgreSQL / MySQL).
      # For college lab and Minikube demonstration, emptyDir provides an isolated,
      # self-initializing storage mount for each Pod replica without requiring
      # cloud infrastructure.
      # ------------------------------------------------------------------------
      volumes:
        - name: eventease-storage
          emptyDir: {}
