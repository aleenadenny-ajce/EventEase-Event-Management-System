{% extends "base.html" %}

{% block title %}Edit Event: {{ event.title }} — EventEase{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card card-modern p-4 p-md-5">
                <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
                    <div class="metric-icon bg-warning text-dark">
                        <i class="bi bi-pencil-square fs-4"></i>
                    </div>
                    <div>
                        <h3 class="fw-bold mb-0">Edit Event</h3>
                        <p class="text-muted small mb-0">Update event details, timing, venue, or status</p>
                    </div>
                </div>

                <form id="eventForm" method="POST" action="{{ url_for('edit_event', event_id=event.id) }}" enctype="multipart/form-data">
                    <div class="row g-3">
                        <div class="col-12">
                            <label for="title" class="form-label small fw-semibold">Event Title *</label>
                            <input type="text" class="form-control" id="title" name="title" value="{{ event.title }}" required>
                        </div>

                        <div class="col-md-6">
                            <label for="category" class="form-label small fw-semibold">Category *</label>
                            <select class="form-select" id="category" name="category" required>
                                {% for cat in categories %}
                                    <option value="{{ cat }}" {% if event.category == cat %}selected{% endif %}>{{ cat }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="status" class="form-label small fw-semibold">Event Status *</label>
                            <select class="form-select" id="status" name="status" required>
                                <option value="Upcoming" {% if event.status == 'Upcoming' %}selected{% endif %}>Upcoming</option>
                                <option value="Ongoing" {% if event.status == 'Ongoing' %}selected{% endif %}>Ongoing</option>
                                <option value="Completed" {% if event.status == 'Completed' %}selected{% endif %}>Completed</option>
                                <option value="Cancelled" {% if event.status == 'Cancelled' %}selected{% endif %}>Cancelled</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label for="description" class="form-label small fw-semibold">Event Description *</label>
                            <textarea class="form-control" id="description" name="description" rows="4" required>{{ event.description }}</textarea>
                        </div>

                        <div class="col-md-4">
                            <label for="date" class="form-label small fw-semibold">Event Date *</label>
                            <input type="date" class="form-control" id="date" name="date" value="{{ event.date }}" required>
                        </div>

                        <div class="col-md-4">
                            <label for="start_time" class="form-label small fw-semibold">Start Time *</label>
                            <input type="time" class="form-control" id="start_time" name="start_time" value="{{ event.start_time }}" required>
                        </div>

                        <div class="col-md-4">
                            <label for="end_time" class="form-label small fw-semibold">End Time *</label>
                            <input type="time" class="form-control" id="end_time" name="end_time" value="{{ event.end_time }}" required>
                        </div>

                        <div class="col-12">
                            <label for="venue" class="form-label small fw-semibold">Venue / Meeting URL *</label>
                            <input type="text" class="form-control" id="venue" name="venue" value="{{ event.venue }}" required>
                        </div>

                        <div class="col-md-6">
                            <label for="capacity" class="form-label small fw-semibold">Maximum Capacity (Seats) *</label>
                            <input type="number" class="form-control" id="capacity" name="capacity" value="{{ event.capacity }}" min="1" max="10000" required>
                        </div>

                        <div class="col-md-6">
                            <label for="registration_deadline" class="form-label small fw-semibold">Registration Deadline *</label>
                            <input type="date" class="form-control" id="registration_deadline" name="registration_deadline" value="{{ event.registration_deadline }}" required>
                        </div>

                        <div class="col-12">
                            <label for="poster" class="form-label small fw-semibold">Update Event Banner (Optional)</label>
                            <input class="form-control" type="file" id="poster" name="poster" accept=".jpg,.jpeg,.png,.webp">
                            <div class="form-text small">Current: <code>{{ event.poster_path }}</code></div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                        <a href="{{ url_for('organizer_dashboard') }}" class="btn btn-outline-secondary">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-primary-custom px-4">
                            <i class="bi bi-check2-circle me-1"></i> Update Event
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
