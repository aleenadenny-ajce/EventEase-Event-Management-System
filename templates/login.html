{% extends "base.html" %}

{% block title %}Sign In — EventEase{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-modern p-4 p-sm-5">
                <div class="text-center mb-4">
                    <div class="metric-icon bg-primary-subtle text-primary mx-auto mb-3" style="width: 56px; height: 56px;">
                        <i class="bi bi-box-arrow-in-right fs-3"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Welcome Back</h3>
                    <p class="text-muted small">Sign in to manage events or access your registrations</p>
                </div>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label small fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0" id="email" name="email" value="{{ email or '' }}" placeholder="name@college.edu" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label small fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 py-2 fw-semibold">
                        Sign In to EventEase
                    </button>
                </form>

                <!-- Demo Account Fast Selector (Examiner Convenience) -->
                <div class="mt-4 pt-3 border-top">
                    <p class="small text-muted fw-semibold text-center mb-2">⚡ Quick Fill Demo Accounts:</p>
                    <div class="d-flex justify-content-center gap-2">
                        <button type="button" class="btn btn-sm btn-outline-danger" onclick="fillDemo('admin@eventease.local', 'Admin@Password123')">
                            Admin
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="fillDemo('organizer@eventease.local', 'Organizer@Password123')">
                            Organizer
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-success" onclick="fillDemo('participant@eventease.local', 'User@Password123')">
                            Participant
                        </button>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <p class="small text-muted mb-0">
                        Don't have an account yet? 
                        <a href="{{ url_for('register') }}" class="text-primary fw-semibold text-decoration-none">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function fillDemo(email, password) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = password;
}
</script>
{% endblock %}
